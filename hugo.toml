baseURL = "https://zqmlabs.com/"
languageCode = "en-us"
title = "ZQM Labs — Z's Quests & Mischief"
# No theme key on purpose: layouts/ in this repo are the whole design.
# (An empty theme = "" breaks Hugo ≥0.15x module loading — don't re-add it.)
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "Community-centered games, shared stories, and a little mischief."
  mantra = "Play more. Plan less."
  email = "zqmcomputing@gmail.com"
  description = "ZQM Labs creates story-driven, community-centered games. Explore the growing game collection, beginning with Wisp's Lost Lanterns."

# Keep the global navigation focused on the visitor's next action.
# Detailed pricing, organizer, press, and seasonal pages remain linked from
# relevant landing pages and the footer/content.
[[menus.main]]
  name = "Play Demo"
  url = "/games/hunt-for-wisps/play/?demo=1"
  weight = 5
[[menus.main]]
  name = "Games"
  url = "/games/"
  weight = 10
[[menus.main]]
  name = "Host a Game"
  url = "/tiers/"
  weight = 20
[[menus.main]]
  name = "Community"
  url = "/community/"
  weight = 30
[[menus.main]]
  name = "Resources"
  url = "/patterns/"
  weight = 40
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 50
[[menus.main]]
  name = "Contact"
  url = "/contact/"
  weight = 60
[[menus.main]]
  name = "FAQ"
  url = "/faq/"
  weight = 70

[markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true # allow inline HTML in content (details accordions, embeds)
