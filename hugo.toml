baseURL = "https://zqmlabs.com/"
languageCode = "en-us"
title = "ZQM Labs — Z's Quests & Mischief"
# No theme key on purpose: layouts/ in this repo are the whole design.
# (An empty theme = "" breaks Hugo ≥0.15x module loading — don't re-add it.)
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "Community-centered games, shared stories, and a little mischief."
  mantra = "Play more. Plan less."
  email = "zqmcomputing@gmail.com"
  description = "ZQM Labs creates story-driven, community-centered location quests. Explore the growing game collection, beginning with Wisp's Lost Lanterns."

