baseURL = "https://zqmlabs.com/"
languageCode = "en-us"
title = "ZQM Labs — Z's Quests & Mischief"
# No theme key on purpose: layouts/ in this repo are the whole design.
# (An empty theme = "" breaks Hugo ≥0.15x module loading — don't re-add it.)
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "Community-centered games, shared stories, and a little mischief."
  mantra = "Play more. Plan less."
  email = "zqmcomputing@gmail.com"
  description = "ZQM Labs creates story-driven, community-centered games. Wisp's Lost Lanterns is the current Halloween game; the site supports a growing collection of titles."

# Main navigation — rendered by layouts/_default/baseof.html on every page.
# To add a page to the nav: add a block here AND create the content file.
[[menus.main]]
  name = "Home"
  url = "/"
  weight = 10
[[menus.main]]
  name = "Games"
  url = "/games/"
  weight = 20
[[menus.main]]
  name = "Halloween"
  url = "/halloween/"
  weight = 30
[[menus.main]]
  name = "Tiers"
  url = "/tiers/"
  weight = 35
[[menus.main]]
  name = "Patterns"
  url = "/patterns/"
  weight = 40
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 45
[[menus.main]]
  name = "FAQ"
  url = "/faq/"
  weight = 50

[markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true # allow inline HTML in content (details accordions, embeds)
