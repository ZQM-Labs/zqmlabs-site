name: Deploy Hugo site to Pages
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - uses: actions/configure-pages@v5
      - name: Fetch player
        run: bash scripts/sync-player.sh main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke-test deployed player source
        run: |
          set -euo pipefail
          PLAYER=static/games/hunt-for-wisps/play
          node --check "$PLAYER/app.js"
          node --check "$PLAYER/global-story.js"
          node --check "$PLAYER/i18n.js"
          node --check "$PLAYER/sw.js"
          line_of() {
            local tag="$1"
            local line
            line="$(grep -nF "$tag" "$PLAYER/index.html" | head -n 1 | cut -d: -f1 || true)"
            if [ -z "$line" ]; then
              echo "ERROR: required script tag missing: $tag" >&2
              exit 1
            fi
            printf '%s\n' "$line"
          }
          GLOBAL_LINE="$(line_of 'src="global-story.js"')"
          I18N_LINE="$(line_of 'src="i18n.js"')"
          APP_LINE="$(line_of 'src="app.js"')"
          if [ "$GLOBAL_LINE" -ge "$I18N_LINE" ] || [ "$I18N_LINE" -ge "$APP_LINE" ]; then
            echo "ERROR: global-story.js and i18n.js must load before app.js, in that order." >&2
            exit 1
          fi
      - name: Verify player precache files exist in site bundle
        env:
          PLAYER_DIR: static/games/hunt-for-wisps/play
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.env.PLAYER_DIR;
          const source = fs.readFileSync(path.join(root, "sw.js"), "utf8");
          const match = source.match(/const SHELL = \[([\s\S]*?)\];/);
          if (!match) throw new Error("Could not parse player service-worker SHELL list");
          const paths = [...match[1].matchAll(/["']([^"']+)["']/g)]
            .map(entry => entry[1])
            .filter(entry => entry.startsWith("./"));
          const missing = paths
            .map(entry => path.join(root, entry.slice(2)))
            .filter(file => !fs.existsSync(file));
          if (missing.length) {
            console.error("Missing player precache files in site bundle:", missing);
            process.exit(1);
          }
          console.log("Verified " + paths.length + " player precache paths exist in the site bundle.");
          NODE
      - name: Build
        run: hugo --gc --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
