name: Deploy Hugo site to Pages
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - uses: actions/configure-pages@v5
      - name: Fetch player
        run: bash scripts/sync-player.sh main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke-test deployed player source
        run: |
          PLAYER=static/games/hunt-for-wisps/play
          node --check "$PLAYER/app.js"
          node --check "$PLAYER/global-story.js"
          node --check "$PLAYER/i18n.js"
          test "$(grep -n 'src="global-story.js"' "$PLAYER/index.html" | cut -d: -f1)" -lt "$(grep -n 'src="i18n.js"' "$PLAYER/index.html" | cut -d: -f1)"
          test "$(grep -n 'src="i18n.js"' "$PLAYER/index.html" | cut -d: -f1)" -lt "$(grep -n 'src="app.js"' "$PLAYER/index.html" | cut -d: -f1)"
      - name: Build
        run: hugo --gc --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
