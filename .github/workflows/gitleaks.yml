name: Gitleaks Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.25.0
      - name: Scan full repository history
        shell: bash
        run: |
          if [ -f .gitleaks.toml ]; then
            gitleaks git --config .gitleaks.toml --report-format json --report-path gitleaks-redacted.json --redact .
          else
            gitleaks git --report-format json --report-path gitleaks-redacted.json --redact .
          fi

      - name: Verify unrelated synthetic credentials remain detectable
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          if [ -f .gitleaksignore ]; then cp .gitleaksignore "$fixture/.gitleaksignore"; fi
          python3 - "$fixture" <<'PY'
          import pathlib
          import secrets
          import string
          import sys
          alphabet = string.ascii_letters + string.digits
          token = "github_pat_" + "".join(secrets.choice(alphabet) for _ in range(82))
          pathlib.Path(sys.argv[1], "synthetic-credential.txt").write_text(
              "github_token = " + token + "\n", encoding="utf-8"
          )
          PY
          set +e
          gitleaks dir --redact --exit-code 7 "$fixture" >/dev/null 2>&1
          status="$?"
          set -e
          if [ "$status" -ne 7 ]; then
            echo "::error::Synthetic credential not detected (status $status)." >&2
            exit 1
          fi
          echo "Independent synthetic credential remains detectable."

      - name: Retain redacted scanner evidence for restricted review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-redacted-${{ github.run_id }}
          path: gitleaks-redacted.json
          if-no-files-found: warn
          retention-days: 7
