name: Prose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@eb5ca3ab411449c66620fe7f1b3c9e10547144b0 # v18
        with:
          globs: '**/*.md'

  links:
    # Internal routes are checked against the generated Hugo output by site-ci.yml.
    # Exclude the live production origin here so an unreleased PR is not judged against stale deployed HTML.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --base https://zqmlabs.com --exclude https://github.com/ZQM-Computing/zqm-labs --exclude https://zqmlabs.com/ '**/*.md'
